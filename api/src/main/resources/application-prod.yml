spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:

  # Redis
  data:
    redis:
      host: ${REDIS_URL}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      refresh-ttl: ${REDIS_TTL}

oauth2:
  naver:
    token-uri: https://nid.naver.com/oauth2/token
    me-uri: https://openapi.naver.com/v1/nid/me
    redirect-uri: ${REDIRECT-URI}
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 300 # 5분


auth:
  cookie:
    name: refreshToken
    secure: false
    sameSite: Lax
    domain: localhost