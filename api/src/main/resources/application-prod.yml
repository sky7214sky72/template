spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:

oauth2:
  naver:
    token-uri: https://nid.naver.com/oauth2/token
    me-uri: https://openapi.naver.com/v1/nid/me
    redirect-uri: https://codeghost.cloud/
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}